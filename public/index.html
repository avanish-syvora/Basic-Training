<!DOCTYPE html>
<html>
<head>
  <title>Upload a File</title>
</head>
<body>
  <h1>Word Frequency Counter</h1>
  <form action="/upload" method="POST" enctype="multipart/form-data">
    <input type="file" name="textfile" accept=".txt" required />
    <button type="submit">Upload & Count</button>
  </form>
</body>
</html>
